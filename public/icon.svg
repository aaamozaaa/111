<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="100" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="#10B981" stroke-opacity="0.25" stroke-width="8" />

  <!-- Background subtle glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="blur(20px)" />

  <!-- Android Robot Head & Studio Shield -->
  <g transform="translate(0, -10)">
    <!-- Antennae -->
    <line x1="210" y1="170" x2="175" y2="130" stroke="#34D399" stroke-width="14" stroke-linecap="round" />
    <line x1="302" y1="170" x2="337" y2="130" stroke="#34D399" stroke-width="14" stroke-linecap="round" />

    <!-- Robot Head Dome -->
    <path d="M166 225 C166 175 206 160 256 160 C306 160 346 175 346 225 Z" fill="url(#greenGrad)" />

    <!-- Eyes -->
    <circle cx="216" cy="205" r="9" fill="#0F172A" />
    <circle cx="296" cy="205" r="9" fill="#0F172A" />

    <!-- Shield Body with Circuit Matrix -->
    <path d="M166 240 H346 V305 C346 365 256 405 256 405 C256 405 166 365 166 305 Z" fill="#1E293B" stroke="#34D399" stroke-width="8" stroke-linejoin="round" />

    <!-- AI Core Diamond / Chip inside shield -->
    <path d="M256 265 L290 299 L256 333 L222 299 Z" fill="url(#greenGrad)" />
    <circle cx="256" cy="299" r="6" fill="#FFFFFF" />

    <!-- Binary / Security tracer lines -->
    <line x1="256" y1="333" x2="256" y2="370" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <line x1="222" y1="299" x2="195" y2="299" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <line x1="290" y1="299" x2="317" y2="299" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
