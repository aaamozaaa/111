name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646f786cece7ee481bcd849f481232" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK Platforms & Build-Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platforms;android-33" "build-tools;33.0.2" || true

      - name: Install npm Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build
          ls -la dist/ || echo "WARNING: dist folder missing after build"

      - name: Add Android Platform with Capacitor
        run: |
          npx --yes @capacitor/cli@7 add android 2>&1 || echo "Android platform may already exist"
          npx --yes @capacitor/cli@7 sync android 2>&1 || npx --yes @capacitor/cli@7 copy android 2>&1
          ls -la android/ || (echo "ERROR: android folder was not created" && exit 1)

      - name: Inject InstalledApps native plugin
        run: |
          set -e
          PKG_DIR="android/app/src/main/java/com/apkaistudio/app"
          mkdir -p "$PKG_DIR"
          cp native/android/InstalledAppsPlugin.java "$PKG_DIR/InstalledAppsPlugin.java"
          echo "Plugin Java copied to $PKG_DIR"

          # Register plugin in MainActivity (Capacitor 7 style)
          MAIN=$(find android/app/src/main/java -name 'MainActivity.java' | head -1)
          if [ -n "$MAIN" ]; then
            if ! grep -q 'InstalledAppsPlugin' "$MAIN"; then
              # Capacitor 7 auto-loads @CapacitorPlugin annotated classes via annotation processor
              # Ensure package matches
              echo "MainActivity found: $MAIN"
            fi
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Add QUERY_ALL_PACKAGES if missing (needed to see other apps on Android 11+)
            if ! grep -q 'QUERY_ALL_PACKAGES' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest |' "$MANIFEST"
              # Insert permission before <application
              sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent>\n    </queries>\n    <application|' "$MANIFEST"
              echo "Added QUERY_ALL_PACKAGES + queries to AndroidManifest"
            fi
            cat "$MANIFEST"
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-AI-Studio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Notify Build Success
        run: |
          echo "✅ APK build completed successfully!"
          echo "Download the APK from the Artifacts section of this workflow run."
