name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646f786cece7ee481bcd849f481232" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af67798781deaa9" > $ANDROID_HOME/licenses/android-sdk-license || true
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license || true
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/google-gdk-license || true
          echo -e "\ne9acab5b5f4428c8b3d32c16d4f0d3c4" > $ANDROID_HOME/licenses/mips-android-sysimage-license || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Install npm Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build
          ls -la dist/ || echo "dist folder missing after build"

      - name: Add Android Platform with Capacitor
        run: |
          # Install CLI if needed and create android project
          npx --yes @capacitor/cli@7 add android 2>&1 || echo "Android platform may already exist"
          npx --yes @capacitor/cli@7 sync android 2>&1 || npx --yes @capacitor/cli@7 copy android 2>&1
          ls -la android/ || echo "android folder check"

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-AI-Studio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Notify Build Success
        run: |
          echo "✅ APK build completed successfully!"
          echo "Download the APK from the Artifacts section of this workflow run."
