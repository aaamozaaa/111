name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Initialize Android Native Project (Capacitor)
        run: |
          npx --yes @capacitor/cli add android || echo "Android folder exists or created"
          npx --yes @capacitor/cli copy android

      - name: Build Android Debug / Release APK with Gradle
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-AI-Studio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Notify Build Success
        run: |
          echo "APK build completed successfully! You can download it from the Artifacts section above."
