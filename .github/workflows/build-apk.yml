name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646f786cece7ee481bcd849f481232" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK Platforms & Build-Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platforms;android-33" "build-tools;33.0.2" || true

      - name: Install npm Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: |
          npm run build
          ls -la dist/ || echo "WARNING: dist folder missing after build"

      - name: Add Android Platform with Capacitor
        run: |
          npx --yes @capacitor/cli@7 add android 2>&1 || echo "Android platform may already exist"
          npx --yes @capacitor/cli@7 sync android 2>&1 || npx --yes @capacitor/cli@7 copy android 2>&1
          ls -la android/ || (echo "ERROR: android folder was not created" && exit 1)

      - name: Inject native plugins + apksig dependencies
        run: |
          set -e

          MAIN=$(find android/app/src/main/java -name 'MainActivity.java' | head -1)
          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //;s/;//' | tr -d '[:space:]')
          PKG_DIR=$(dirname "$MAIN")
          mkdir -p "$PKG_DIR"
          echo "Package: $PKG"

          sed "s/^package .*/package ${PKG};/" native/android/InstalledAppsPlugin.java > "$PKG_DIR/InstalledAppsPlugin.java"
          sed "s/^package .*/package ${PKG};/" native/android/ApkSignerPlugin.java > "$PKG_DIR/ApkSignerPlugin.java"

          cat > "$MAIN" << 'MAINEOF'
          package PLACEHOLDER_PKG;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(InstalledAppsPlugin.class);
              registerPlugin(ApkSignerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          MAINEOF
          sed -i "s/PLACEHOLDER_PKG/${PKG}/" "$MAIN"
          sed -i 's/^          //' "$MAIN"
          cat "$MAIN"

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'com.android.tools.build:apksig' "$APP_GRADLE"; then
              sed -i '/dependencies {/a\    implementation "com.android.tools.build:apksig:8.2.2"\n    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"\n    implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"' "$APP_GRADLE"
              echo "Added apksig + bouncycastle"
            fi

            # Fix duplicate META-INF from BouncyCastle multi-release JARs
            if ! grep -q 'META-INF/versions' "$APP_GRADLE"; then
              # Insert packaging block inside android { after the opening
              python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text()
          packaging = '''
      packaging {
          resources {
              excludes += [
                  "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
                  "META-INF/DEPENDENCIES",
                  "META-INF/LICENSE",
                  "META-INF/LICENSE.txt",
                  "META-INF/license.txt",
                  "META-INF/NOTICE",
                  "META-INF/NOTICE.txt",
                  "META-INF/notice.txt",
                  "META-INF/*.SF",
                  "META-INF/*.DSA",
                  "META-INF/*.RSA",
                  "META-INF/OSGI-INF/**"
              ]
              pickFirsts += ["META-INF/*"]
          }
      }
          '''
          if "packaging {" not in text:
              # after android {
              text = text.replace("android {", "android {" + packaging, 1)
              p.write_text(text)
              print("Added packaging excludes")
          else:
              print("packaging block already present")
          PY
            fi
            echo "--- app/build.gradle ---"
            cat "$APP_GRADLE"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'QUERY_ALL_PACKAGES' "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent>\n    </queries>\n    <application|' "$MANIFEST"
              if ! grep -q 'xmlns:tools' "$MANIFEST"; then
                sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
              fi
            fi
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-AI-Studio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Notify Build Success
        run: |
          echo "✅ APK build completed successfully!"
